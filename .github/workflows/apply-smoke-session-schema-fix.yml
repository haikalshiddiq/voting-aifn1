name: Fix AiFn1 D1 smoke_sessions schema

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voting-aifn1-production-d1-fix
  cancel-in-progress: false

jobs:
  migrate-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Validate migration file
        shell: bash
        run: |
          set -euo pipefail
          test -f migrations/0003_fix_smoke_sessions_id.sql
          grep -Fq 'ALTER TABLE smoke_sessions ADD COLUMN id TEXT' migrations/0003_fix_smoke_sessions_id.sql
          grep -Fq 'idx_smoke_sessions_id' migrations/0003_fix_smoke_sessions_id.sql

      - name: Inspect schema before migration
        run: npx wrangler d1 execute voting-aifn1 --remote --command "PRAGMA table_info(smoke_sessions);"

      - name: Apply pending D1 migrations
        run: npx wrangler d1 migrations apply voting-aifn1 --remote

      - name: Verify id column exists
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute voting-aifn1 --remote --json \
            --command "SELECT COUNT(*) AS id_column_count FROM pragma_table_info('smoke_sessions') WHERE name='id';" \
            > d1-schema.json
          cat d1-schema.json
          python3 <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("d1-schema.json").read_text())
          rows = []
          for item in payload if isinstance(payload, list) else [payload]:
              result = item.get("results", []) if isinstance(item, dict) else []
              rows.extend(result if isinstance(result, list) else [])

          count = int(rows[0].get("id_column_count", 0)) if rows else 0
          if count != 1:
              raise SystemExit("::error::Kolom smoke_sessions.id belum tersedia setelah migrasi")
          print("PASS: smoke_sessions.id tersedia")
          PY

      - name: Show final schema
        run: npx wrangler d1 execute voting-aifn1 --remote --command "PRAGMA table_info(smoke_sessions);"
