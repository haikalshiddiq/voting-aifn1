name: Fix AiFn1 UI voting deadline

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voting-aifn1-production-ui-fix
  cancel-in-progress: false

jobs:
  patch-qa-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Patch visible deadline and PWA cache
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path

          old_labels = (
              "Batas akhir: Minggu, 15 November 2026 · 23.59 WIB",
              "Minggu, 15 November 2026 pukul 23.59 WIB",
              "Minggu, 15 November 2026 · 23.59 WIB",
          )
          new_label = "Batas akhir: Rabu, 18 November 2026 · 23.59 WIB"
          target_iso = "2026-11-18T16:59:00.000Z"
          text_files = [
              Path("public/index.html"),
              Path("public/admin.html"),
              Path("src/index.js"),
              Path("scripts/qa.mjs"),
          ]

          replacements = 0
          for path in text_files:
              text = path.read_text()
              updated = text
              for old in old_labels:
                  replacement = new_label if old.startswith("Batas akhir:") else new_label.removeprefix("Batas akhir: ")
                  updated = updated.replace(old, replacement)
              updated = re.sub(
                  r"2026-11-(?:15|18)T16:59:00(?:\.000)?Z",
                  target_iso,
                  updated,
              )
              if updated != text:
                  path.write_text(updated)
                  replacements += 1
                  print("UPDATED:", path)

          index_html = Path("public/index.html").read_text()
          if new_label not in index_html:
              raise SystemExit(
                  "::error file=public/index.html::Label batas akhir tidak ditemukan. "
                  "Pastikan UI memuat: " + new_label
              )

          sw = Path("public/sw.js")
          sw_text = sw.read_text()
          new_sw = re.sub(
              r"aifn1-v5-lecturer-smoke(?:-ui\d+)?",
              "aifn1-v5-lecturer-smoke-ui2",
              sw_text,
          )
          if new_sw == sw_text and "aifn1-v5-lecturer-smoke-ui2" not in sw_text:
              raise SystemExit("::error file=public/sw.js::Nama cache PWA tidak ditemukan")
          sw.write_text(new_sw)

          print("UI deadline:", new_label)
          print("ISO deadline:", target_iso)
          print("PWA cache: aifn1-v5-lecturer-smoke-ui2")
          print("Files changed:", replacements)
          PY

      - name: QA deadline consistency
        shell: bash
        run: |
          set -euo pipefail
          old='Minggu, 15 November 2026'
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude='*.log' "$old" public src scripts; then
            echo "::error::Masih ada label deadline lama di source."
            exit 1
          fi
          grep -Fq 'Batas akhir: Rabu, 18 November 2026 · 23.59 WIB' public/index.html
          grep -Fq '2026-11-18T16:59:00.000Z' src/index.js
          grep -Fq 'aifn1-v5-lecturer-smoke-ui2' public/sw.js
          node --check src/index.js
          node --check scripts/qa.mjs
          npm run qa

      - name: Deploy updated Worker and assets
        run: npx wrangler deploy

      - name: Production smoke test
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://voting-aifn1.hicall.workers.dev"
          curl --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-delay 4 --retry-all-errors \
            --header 'Cache-Control: no-cache' \
            --output production-index.html \
            "$base_url/?qa=$(date +%s)"
          grep -Fq 'Batas akhir: Rabu, 18 November 2026 · 23.59 WIB' production-index.html
          echo "PASS: label deadline produksi sudah diperbarui"

      - name: Commit source update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/admin.html public/sw.js src/index.js scripts/qa.mjs
          if ! git diff --cached --quiet; then
            git commit -m "fix: update visible voting deadline to 18 November 2026"
            git push origin HEAD:main
          fi
