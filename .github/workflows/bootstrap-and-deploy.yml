name: Bootstrap and Deploy AiFn1 PWA

on:
  workflow_dispatch:
    inputs:
      turnstile_site_key:
        description: "Turnstile Site Key produksi"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: voting-aifn1-production
  cancel-in-progress: false

jobs:
  bootstrap-and-deploy:
    name: Bootstrap and Deploy AiFn1 PWA
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      TURNSTILE_SITE_KEY: ${{ inputs.turnstile_site_key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate files and secrets
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "package.json"
            "wrangler.jsonc"
            "src/index.js"
            "src/eligible.json"
            "public/index.html"
            "public/admin.html"
            "public/manifest.webmanifest"
            "public/sw.js"
            "migrations/0001_init.sql"
            "scripts/bootstrap_d1.py"
            "scripts/patch.py"
            "scripts/qa.mjs"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::File tidak ditemukan: $file"
              exit 1
            fi
          done

          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || {
            echo "::error::CLOUDFLARE_ACCOUNT_ID belum tersedia"
            exit 1
          }

          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo "::error::CLOUDFLARE_API_TOKEN belum tersedia"
            exit 1
          }

          test -n "${ADMIN_KEY:-}" || {
            echo "::error::ADMIN_KEY belum tersedia"
            exit 1
          }

          test -n "${TURNSTILE_SECRET_KEY:-}" || {
            echo "::error::TURNSTILE_SECRET_KEY belum tersedia"
            exit 1
          }

          test -n "${TURNSTILE_SITE_KEY:-}" || {
            echo "::error::Turnstile Site Key belum diisi"
            exit 1
          }

          if [ "${#ADMIN_KEY}" -lt 32 ]; then
            echo "::error::ADMIN_KEY minimal 32 karakter"
            exit 1
          fi

          echo "Semua file, secrets, dan input tersedia."

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund

      - name: Normalize configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 -c "import json,pathlib; p=pathlib.Path('wrangler.jsonc'); c=json.loads(p.read_text()); c.update({'name':'voting-aifn1','compatibility_date':'2026-11-11','workers_dev':True}); p.write_text(json.dumps(c,indent=2)+'\n')"

          echo "Konfigurasi Wrangler dinormalisasi."

      - name: Create or locate D1
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bootstrap_d1.py

      - name: Validate D1 configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 -c "import json; c=json.load(open('wrangler.jsonc')); d=c.get('d1_databases',[]); assert len(d)==1, 'Harus ada tepat satu D1'; assert d[0].get('binding')=='DB', 'Binding harus DB'; assert d[0].get('database_name')=='voting-aifn1', 'Nama D1 harus voting-aifn1'; assert d[0].get('database_id') not in ('','REPLACE_WITH_D1_DATABASE_ID'), 'D1 database_id belum terpasang'; print('D1 siap:',d[0]['database_id'])"

      - name: Configure Turnstile Site Key
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch.py "$TURNSTILE_SITE_KEY"

      - name: Run QA
        shell: bash
        run: |
          set -euo pipefail
          npm run qa
          node --check src/index.js

      - name: Apply D1 migrations
        shell: bash
        run: |
          set -euo pipefail

          npx wrangler d1 migrations apply \
            voting-aifn1 \
            --remote

      - name: Upload ADMIN_KEY
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$ADMIN_KEY" |
            npx wrangler secret put ADMIN_KEY

      - name: Upload Turnstile Secret Key
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$TURNSTILE_SECRET_KEY" |
            npx wrangler secret put TURNSTILE_SECRET_KEY

      - name: Deploy Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          npx wrangler deploy 2>&1 |
            tee wrangler-deploy.log

          WORKER_URL=$(
            grep -Eo \
              'https://[A-Za-z0-9.-]+\.workers\.dev' \
              wrangler-deploy.log |
            grep -v '\.preview\.' |
            head -n 1 || true
          )

          if [ -z "${WORKER_URL:-}" ]; then
            WORKER_URL="https://voting-aifn1.hicall.workers.dev"
          fi

          WORKER_URL="${WORKER_URL%/}"

          echo "worker_url=$WORKER_URL" \
            >> "$GITHUB_OUTPUT"

          echo "Production Worker URL:"
          echo "$WORKER_URL"

      - name: Verify deployment through Wrangler
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments list

      - name: Optional workers.dev health check
        continue-on-error: true
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set +e

          rm -f api-config.json

          HTTP_CODE=$(
            curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 10 \
              --max-time 30 \
              --retry 2 \
              --retry-delay 5 \
              --retry-all-errors \
              --output api-config.json \
              --write-out "%{http_code}" \
              --header "Accept: application/json" \
              --header "Cache-Control: no-cache" \
              --user-agent \
              "Voting-AiFn1-Health-Check/1.0" \
              "${WORKER_URL}/api/config"
          )

          echo "HTTP status: $HTTP_CODE"

          if [ -f api-config.json ]; then
            cat api-config.json
            echo ""
          fi

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Health check informatif gagal atau terkena Cloudflare 1042. Deployment tetap terverifikasi melalui Wrangler."
            exit 0
          fi

          python3 -c "import json; d=json.load(open('api-config.json')); assert len(d.get('candidates',[]))==37, 'Jumlah kandidat harus 37'; assert d.get('deadline')=='2026-11-13T04:30:00.000Z', 'Deadline server tidak sesuai'; print('Health check berhasil: 37 kandidat')"

      - name: Show production URLs
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail

          echo "## Deployment AiFn1 berhasil" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- Mahasiswa: ${WORKER_URL}" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- Admin: ${WORKER_URL}/admin.html" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "- API: ${WORKER_URL}/api/config" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "Halaman mahasiswa:"
          echo "$WORKER_URL"

          echo "Halaman admin:"
          echo "${WORKER_URL}/admin.html"

      - name: Commit generated D1 configuration
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add wrangler.jsonc

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan konfigurasi."
          else
            git commit \
              -m "chore: configure AiFn1 D1"

            git push origin HEAD:main
          fi
