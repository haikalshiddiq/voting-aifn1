name: Bootstrap and Deploy AiFn1 PWA

on:
  workflow_dispatch:
    inputs:
      turnstile_site_key:
        description: "Turnstile Site Key produksi"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: voting-aifn1-production
  cancel-in-progress: false

jobs:
  bootstrap-and-deploy:
    name: Bootstrap and Deploy AiFn1 PWA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      TURNSTILE_SITE_KEY: ${{ inputs.turnstile_site_key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate required files and secrets
        shell: bash
        run: |
          set -euo pipefail
          for file in package.json wrangler.jsonc src/index.js src/eligible.json public/index.html public/admin.html public/manifest.webmanifest public/sw.js migrations/0001_init.sql scripts/bootstrap_d1.py scripts/patch.py scripts/qa.mjs; do
            test -f "$file" || { echo "::error file=$file::File tidak ditemukan: $file"; exit 1; }
          done
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::CLOUDFLARE_ACCOUNT_ID belum tersedia"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::CLOUDFLARE_API_TOKEN belum tersedia"; exit 1; }
          test -n "${ADMIN_KEY:-}" || { echo "::error::ADMIN_KEY belum tersedia"; exit 1; }
          test -n "${TURNSTILE_SECRET_KEY:-}" || { echo "::error::TURNSTILE_SECRET_KEY belum tersedia"; exit 1; }
          test -n "${TURNSTILE_SITE_KEY:-}" || { echo "::error::Turnstile Site Key belum diisi"; exit 1; }
          test "${#ADMIN_KEY}" -ge 32 || { echo "::error::ADMIN_KEY minimal 32 karakter"; exit 1; }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Normalize Wrangler configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import json,pathlib; p=pathlib.Path('wrangler.jsonc'); c=json.loads(p.read_text()); c.update({'name':'voting-aifn1','compatibility_date':'2026-11-11','workers_dev':True}); p.write_text(json.dumps(c,indent=2)+'\n')"

      - name: Create or locate AiFn1 D1 database
        run: python3 scripts/bootstrap_d1.py

      - name: Validate D1 configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import json; c=json.load(open('wrangler.jsonc')); d=c.get('d1_databases',[]); assert len(d)==1; assert d[0].get('binding')=='DB'; assert d[0].get('database_name')=='voting-aifn1'; assert d[0].get('database_id') not in ('','REPLACE_WITH_D1_DATABASE_ID'); print('D1 siap:',d[0]['database_id'])"

      - name: Configure Turnstile Site Key
        run: python3 scripts/patch.py "$TURNSTILE_SITE_KEY"

      - name: Validate AiFn1 roster deadline and fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import json,pathlib; e=json.load(open('src/eligible.json')); w=pathlib.Path('src/index.js').read_text(); h=pathlib.Path('public/index.html').read_text(); sw=pathlib.Path('public/sw.js').read_text(); vote=w[w.index("u.pathname==='/api/vote'"):w.index("u.pathname==='/api/admin'")]; assert len(e)==37; assert len({x['nim'] for x in e})==37; assert '2026-11-15T16:59:00.000Z' in w; assert 'await TS(' not in vote; assert 'TTL=900000' in w; assert "document.getElementById('logout').addEventListener('click',window.doLogout)" in h; assert "logout.addEventListener('click',window.doLogout)" not in h; assert 'aifn1-v4-hardened' in sw; assert "document.getElementById('redeemForm')" in h; assert 'f.onsubmit=' not in h; assert 'AbortController()' in h; print('Roster, deadline, voting, dan logout fix valid')"

      - name: Run application QA
        run: npm run qa && node --check src/index.js

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply voting-aifn1 --remote

      - name: Upload ADMIN_KEY
        run: printf '%s' "$ADMIN_KEY" | npx wrangler secret put ADMIN_KEY

      - name: Upload Turnstile Secret Key
        run: printf '%s' "$TURNSTILE_SECRET_KEY" | npx wrangler secret put TURNSTILE_SECRET_KEY

      - name: Deploy voting-aifn1 Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          rm -f wrangler-deploy.log
          npx wrangler deploy 2>&1 | tee wrangler-deploy.log
          DEPLOY_EXIT="${PIPESTATUS[0]}"
          if [ "$DEPLOY_EXIT" -ne 0 ]; then exit "$DEPLOY_EXIT"; fi
          WORKER_URL=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' wrangler-deploy.log | grep -v '\.preview\.' | head -n 1 || true)
          if [ -z "${WORKER_URL:-}" ]; then WORKER_URL="https://voting-aifn1.hicall.workers.dev"; fi
          echo "worker_url=${WORKER_URL%/}" >> "$GITHUB_OUTPUT"

      - name: Record deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s wrangler-deploy.log || { echo "::error::Log deployment kosong"; exit 1; }
          tail -n 40 wrangler-deploy.log

      - name: Optional workers.dev health check
        continue-on-error: true
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set +e
          HTTP_CODE=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 5 --retry-all-errors --output api-config.json --write-out "%{http_code}" --header "Accept: application/json" --header "Cache-Control: no-cache" --user-agent "Voting-AiFn1-Health-Check/2.0" "${WORKER_URL}/api/config")
          echo "HTTP status: $HTTP_CODE"
          test -f api-config.json && cat api-config.json || true
          if [ "$HTTP_CODE" != "200" ]; then echo "::warning::Health check informatif gagal/1042. Deployment tidak digagalkan."; exit 0; fi
          python3 -c "import json; d=json.load(open('api-config.json')); assert len(d.get('candidates',[]))==37; assert d.get('deadline')=='2026-11-15T16:59:00.000Z'; print('Health check berhasil: 37 kandidat')"

      - name: Show production URLs
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          echo "## Deployment AiFn1 berhasil" >> "$GITHUB_STEP_SUMMARY"
          echo "- Eligible: 37 mahasiswa" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deadline: Minggu, 15 November 2026 pukul 23.59 WIB" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mahasiswa: ${WORKER_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Admin: ${WORKER_URL}/admin.html" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${WORKER_URL}/api/config" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit generated D1 configuration
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler.jsonc
          if ! git diff --cached --quiet; then git commit -m "chore: configure AiFn1 D1" && git push origin HEAD:main; fi
