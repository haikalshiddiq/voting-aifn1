name: Bootstrap and Deploy AiFn1 PWA

on:
  workflow_dispatch:
    inputs:
      turnstile_site_key:
        description: "Turnstile Site Key produksi"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: voting-aifn1-production
  cancel-in-progress: false

jobs:
  bootstrap-and-deploy:
    name: Bootstrap and Deploy AiFn1 PWA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      TURNSTILE_SITE_KEY: ${{ inputs.turnstile_site_key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate required files and secrets
        shell: bash
        run: |
          set -euo pipefail
          files=(
            package.json wrangler.jsonc src/index.js src/eligible.json
            public/index.html public/admin.html public/manifest.webmanifest public/sw.js
            migrations/0001_init.sql migrations/0002_lecturer_smoke_test.sql
            scripts/bootstrap_d1.py scripts/patch.py scripts/qa.mjs
          )
          for file in "${files[@]}"; do
            test -f "$file" || { echo "::error file=$file::File tidak ditemukan: $file"; exit 1; }
          done
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::CLOUDFLARE_ACCOUNT_ID belum tersedia"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::CLOUDFLARE_API_TOKEN belum tersedia"; exit 1; }
          test -n "${ADMIN_KEY:-}" || { echo "::error::ADMIN_KEY belum tersedia"; exit 1; }
          test -n "${TURNSTILE_SECRET_KEY:-}" || { echo "::error::TURNSTILE_SECRET_KEY belum tersedia"; exit 1; }
          test -n "${TURNSTILE_SITE_KEY:-}" || { echo "::error::Turnstile Site Key belum diisi"; exit 1; }
          test "${#ADMIN_KEY}" -ge 32 || { echo "::error::ADMIN_KEY minimal 32 karakter"; exit 1; }

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::Lock file tidak ditemukan; menggunakan npm install."
            npm install --no-audit --no-fund
          fi

      - name: Normalize Wrangler configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          p = Path("wrangler.jsonc")
          c = json.loads(p.read_text())
          c.update({
              "name": "voting-aifn1",
              "compatibility_date": "2026-11-11",
              "workers_dev": True,
          })
          p.write_text(json.dumps(c, indent=2) + "\n")
          PY

      - name: Create or locate AiFn1 D1 database
        run: python3 scripts/bootstrap_d1.py

      - name: Validate D1 configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          with open("wrangler.jsonc") as f:
              c = json.load(f)
          d = c.get("d1_databases", [])
          assert len(d) == 1
          assert d[0].get("binding") == "DB"
          assert d[0].get("database_name") == "voting-aifn1"
          assert d[0].get("database_id") not in ("", "REPLACE_WITH_D1_DATABASE_ID")
          print("D1 siap:", d[0]["database_id"])
          PY

      - name: Configure Turnstile Site Key
        run: python3 scripts/patch.py "$TURNSTILE_SITE_KEY"

      - name: Apply voting deadline
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path

          target = "2026-11-18T16:59:00.000Z"
          files = [
              Path("src/index.js"),
              Path("public/index.html"),
              Path("public/admin.html"),
              Path("public/sw.js"),
              Path("scripts/qa.mjs"),
          ]
          pattern = re.compile(r"2026-11-(?:15|18)T16:59:00(?:\.000)?Z")
          changed = []

          for path in files:
              text = path.read_text()
              updated, count = pattern.subn(target, text)
              if updated != text:
                  path.write_text(updated)
                  changed.append(f"{path} ({count})")

          worker = Path("src/index.js").read_text()
          qa_script = Path("scripts/qa.mjs").read_text()
          if target not in worker:
              raise SystemExit(
                  "::error file=src/index.js::Deadline tidak ditemukan atau formatnya berbeda. "
                  "Tetapkan deadline aplikasi ke 2026-11-18T16:59:00.000Z."
              )

          if "2026-11-15T16:59:00" in qa_script:
              raise SystemExit("::error file=scripts/qa.mjs::QA masih menguji deadline lama")

          print("Deadline aktif:", target)
          print("File diperbarui:", ", ".join(changed) if changed else "sudah terbaru")
          PY

      - name: Validate AiFn1 roster deadline and fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          failures = []
          eligible = json.loads(Path("src/eligible.json").read_text())
          worker = Path("src/index.js").read_text()
          index_html = Path("public/index.html").read_text()
          admin_html = Path("public/admin.html").read_text()
          service_worker = Path("public/sw.js").read_text()

          def check(condition, message):
              if condition:
                  print("PASS:", message)
              else:
                  print("FAIL:", message)
                  failures.append(message)

          check(len(eligible) == 37, f"roster berisi 37 entri; aktual {len(eligible)}")
          nim = [str(x.get("nim", "")) for x in eligible]
          check(all(nim), "semua entri memiliki NIM")
          check(len(set(nim)) == len(nim), "seluruh NIM unik")
          check("2026-11-18T16:59:00.000Z" in worker, "deadline Worker sudah 18 November 2026 23:59 WIB")

          vote_marker = "u.pathname==='/api/vote'"
          admin_marker = "u.pathname==='/api/admin'"
          if vote_marker in worker and admin_marker in worker:
              vote = worker[worker.index(vote_marker):worker.index(admin_marker)]
              check("await TS(" not in vote, "jalur vote tidak menjalankan await TS")
          else:
              print("NOTICE: marker route vote/admin berbeda; pemeriksaan khusus await TS dilewati")

          checks = [
              ("TTL=900000" in worker, "TTL Worker 900000 ms"),
              ("AbortController()" in index_html, "AbortController tersedia di UI"),
              ("smoke_ballots" in worker, "smoke_ballots tersedia"),
              ("Reset Smoke Test Dosen" in admin_html, "kontrol reset smoke test tersedia"),
              ("aifn1-v5-lecturer-smoke" in service_worker, "versi cache service worker sesuai"),
          ]
          for condition, message in checks:
              check(condition, message)

          if failures:
              print("::error::Validasi AiFn1 gagal: " + "; ".join(failures))
              raise SystemExit(1)
          print("Semua validasi kritis AiFn1 lulus")
          PY

      - name: Run application QA
        shell: bash
        run: |
          set -euo pipefail
          echo "Memeriksa referensi deadline lama..."
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules \
            --exclude='*.log' '2026-11-15T16:59:00' src public scripts; then
            echo "::error::Masih ada referensi deadline lama di source atau QA."
            exit 1
          fi
          node --check src/index.js
          node --check scripts/qa.mjs
          npm run qa

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply voting-aifn1 --remote

      - name: Upload ADMIN_KEY
        run: printf '%s' "$ADMIN_KEY" | npx wrangler secret put ADMIN_KEY

      - name: Upload Turnstile Secret Key
        run: printf '%s' "$TURNSTILE_SECRET_KEY" | npx wrangler secret put TURNSTILE_SECRET_KEY

      - name: Deploy voting-aifn1 Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          rm -f wrangler-deploy.log
          set +e
          npx wrangler deploy 2>&1 | tee wrangler-deploy.log
          deploy_exit="${PIPESTATUS[0]}"
          set -e
          if [ "$deploy_exit" -ne 0 ]; then exit "$deploy_exit"; fi
          worker_url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' wrangler-deploy.log | grep -v '\.preview\.' | head -n 1 || true)
          if [ -z "${worker_url:-}" ]; then worker_url="https://voting-aifn1.hicall.workers.dev"; fi
          echo "worker_url=${worker_url%/}" >> "$GITHUB_OUTPUT"

      - name: Record deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s wrangler-deploy.log || { echo "::error::Log deployment kosong"; exit 1; }
          tail -n 40 wrangler-deploy.log

      - name: Production health and smoke check
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          http_code=$(curl --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --output api-config.json --write-out "%{http_code}" \
            --header "Accept: application/json" \
            --header "Cache-Control: no-cache" \
            --user-agent "Voting-AiFn1-Health-Check/3.0" \
            "${WORKER_URL}/api/config")
          echo "HTTP status: $http_code"
          test "$http_code" = "200" || { cat api-config.json || true; exit 1; }
          python3 <<'PY'
          import json
          with open("api-config.json") as f:
              data = json.load(f)
          assert len(data.get("candidates", [])) == 37
          assert data.get("deadline") == "2026-11-18T16:59:00.000Z"
          print("Health check berhasil: 37 kandidat dan deadline benar")
          PY

      - name: Show production URLs
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          {
            echo "## Deployment AiFn1 berhasil"
            echo "- Eligible: 37 mahasiswa"
            echo "- Deadline: Rabu, 18 November 2026 pukul 23.59 WIB"
            echo "- Mahasiswa: ${WORKER_URL}"
            echo "- Admin: ${WORKER_URL}/admin.html"
            echo "- API: ${WORKER_URL}/api/config"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit generated D1 configuration
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler.jsonc
          if ! git diff --cached --quiet; then
            git commit -m "chore: configure AiFn1 D1"
            git push origin HEAD:main
          fi
